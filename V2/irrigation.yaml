# Board: ESP32 DevKit V1 (Espressif)
# Definition: definitions/boards/esp32-devkit-v1/manifest.yaml
#
# Updated to fit PCB layout

esphome:
  name: waterizerv2
  friendly_name: WaterizerV2
  on_boot:
     priority: -100
     then:
       - switch.turn_on: led3
esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: warn
  baud_rate: 0
debug:
  update_interval: 15s

api:
  encryption:
    key: "<KEY>"

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: WaterizerV2 Fallback Hotspot
    password: "<KEY>"

captive_portal:

globals:
  - id: zone1_needs_water
    type: bool
    initial_value: 'false'
  - id: zone2_needs_water
    type: bool
    initial_value: 'false'
  - id: zone3_needs_water
    type: bool
    initial_value: 'false'
  - id: zone4_needs_water
    type: bool
    initial_value: 'false'
  - id: zone5_needs_water
    type: bool
    initial_value: 'false'
    
i2c:
  scl: GPIO21
  sda: GPIO22
  scan: true
  id: bus_a
  frequency: 100kHz
  
switch:
  - platform: restart
    name: WaterizerV2 Restart

#
# Output stages
#
  - platform: gpio
    name: zone1
    pin:
      number: 23
      inverted: false
      mode: output
    id: pump1
    restore_mode: ALWAYS_OFF  

  - platform: gpio
    name: zone2
    pin:
      number: 19
      inverted: false
      mode: output
    id: pump2
    restore_mode: ALWAYS_OFF  

  - platform: gpio
    name: zone3
    pin:
      number: 18
      inverted: false
      mode: output
    id: pump3
    restore_mode: ALWAYS_OFF  
    
  - platform: gpio
    name: zone4
    pin:
      number: 17
      inverted: false
      mode: output
    id: pump4
    restore_mode: ALWAYS_OFF  

  - platform: gpio
    name: zone5
    pin:
      number: 16
      inverted: false
      mode: output
    id: pump5
    restore_mode: ALWAYS_OFF  


# Power control for moisture sensors    
  - platform: gpio
    name: MoisturePower
    pin:
      number: 33
      inverted: true
      mode: output
    id: Moisture
    restore_mode: ALWAYS_OFF  
    
  - platform: template
    name: "Zone 1 Enabled"
    id: zone1_enabled
    optimistic: true
    # This is the corrected line:
    restore_mode: RESTORE_DEFAULT_ON
  
    icon: "mdi:toggle-switch"

  - platform: template
    name: "Zone 2 Enabled"
    id: zone2_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    icon: "mdi:toggle-switch"

  - platform: template
    name: "Zone 3 Enabled"
    id: zone3_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    icon: "mdi:toggle-switch"

  - platform: template
    name: "Zone 4 Enabled"
    id: zone4_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  
    icon: "mdi:toggle-switch"

  - platform: template
    name: "Zone 5 Enabled"
    id: zone5_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    icon: "mdi:toggle-switch"

# LED Indicators

  - platform: gpio
    name: LED1
    pin:
      number: 25
      inverted: false
      mode: output
    id: led1

  - platform: gpio
    name: LED2
    pin:
      number: 26
      inverted: false
      mode: output
    id: led2

  - platform: gpio
    name: LED3
    pin:
      number: 4
      inverted: false
      mode: output
    id: led3

sensor:


       
  - platform: ina226
    i2c_id: bus_a
    address: 0x40
    shunt_resistance: 0.1 ohm
    current:
      name: "Battery Charge Current"
      unit_of_measurement: "A"
      accuracy_decimals: 3
    power:
      name: "Battery Charge Power"
      unit_of_measurement: "W"
      accuracy_decimals: 2
    bus_voltage:
      name: "Battery Voltage"
      unit_of_measurement: "V"
      accuracy_decimals: 2
   # max_voltage: 20.0V
   # max_current: 3.2A
    update_interval: 5s

#
# Sensor connections are reversed compared to screen print so reversing order here to match the case
  - platform: adc
    pin: GPIO32
    name: "Sensor 1"
#    update_interval: 10s
    update_interval: never
    samples: 5    
    id: "Sensor1"
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: humidity
    icon: "mdi:watering-can"
    filters:
      - calibrate_linear:
          - 2.75 -> 0
          - 1.022 -> 100
      - lambda: |
          if (x < 0) return 0;
          if (x > 100) return 100;
          return x;
    on_value:
      then:
        - lambda: |
            // Hysteresis Logic
            if (id(Sensor1).state < 75.0) {
              id(zone1_needs_water) = true;
            }
            if (id(Sensor1).state > 80.0) {
              id(zone1_needs_water) = false;
            }

        - if:
            condition:
              lambda: 'return id(zone1_needs_water);'
            then:
              - script.execute: water_zone_1
                
  - platform: adc
    pin: GPIO35
    name: "Sensor 2"
#    update_interval: 10s
    update_interval: never
    samples: 5    
    id: "Sensor2"
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: humidity
    icon: "mdi:watering-can"
    filters:
      - calibrate_linear:
          - 2.75 -> 0
          - 1.022 -> 100
      - lambda: |
          if (x < 0) return 0;
          if (x > 100) return 100;
          return x;
    on_value:
      then:
        - lambda: |
            // Hysteresis Logic
            if (id(Sensor2).state < 75.0) {
              id(zone2_needs_water) = true;
            }
            if (id(Sensor2).state > 80.0) {
              id(zone2_needs_water) = false;
            }

        - if:
            condition:
              lambda: 'return id(zone2_needs_water);'
            then:
              - script.execute: water_zone_2
          
  - platform: adc
    pin: GPIO34
    name: "Sensor 3"
#    update_interval: 10s
    update_interval: never
    samples: 5   
    id: "Sensor3"
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: humidity
    icon: "mdi:watering-can"
    filters:
      - calibrate_linear:
          - 2.75 -> 0
          - 1.022 -> 100689459
      - lambda: |
          if (x < 0) return 0;
          if (x > 100) return 100;
          return x;
    on_value:
      then:
        - lambda: |
            // Hysteresis Logic
            if (id(Sensor3).state < 75.0) {
              id(zone3_needs_water) = true;
            }
            if (id(Sensor3).state > 80.0) {
              id(zone3_needs_water) = false;
            }

        - if:
            condition:
              lambda: 'return id(zone3_needs_water);'
            then:
              - script.execute: water_zone_3

  - platform: adc
    pin: GPIO39
    name: "Sensor 4"
#    update_interval: 10s
    update_interval: never
    samples: 5   
    id: "Sensor4"
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: humidity
    icon: "mdi:watering-can"
    filters:
      - calibrate_linear:
          - 2.75 -> 0
          - 1.022 -> 100
      - lambda: |
          if (x < 0) return 0;
          if (x > 100) return 100;
          return x;
    on_value:
      then:
        - lambda: |
            // Hysteresis Logic
            if (id(Sensor4).state < 75.0) {
              id(zone4_needs_water) = true;
            }
            if (id(Sensor4).state > 80.0) {
              id(zone4_needs_water) = false;
            }

        - if:
            condition:
              lambda: 'return id(zone4_needs_water);'
            then:
              - script.execute: water_zone_4

  - platform: adc
    pin: GPIO36
    name: "Sensor 5"
#    update_interval: 10s
    update_interval: never
    samples: 5   
    id: "Sensor5"
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: humidity
    icon: "mdi:watering-can"
    filters:
      - calibrate_linear:
          - 2.75 -> 0
          - 1.022 -> 100
      - lambda: |
          if (x < 0) return 0;
          if (x > 100) return 100;
          return x;
    on_value:
      then:
        - lambda: |
            // Hysteresis Logic
            if (id(Sensor5).state < 75.0) {
              id(zone5_needs_water) = true;
            }
            if (id(Sensor5).state > 80.0) {
              id(zone5_needs_water) = false;
            }

        - if:
            condition:
              lambda: 'return id(zone5_needs_water);'
            then:
              - script.execute: water_zone_5

  - platform: debug
    free:
      name: "Heap Free"
    loop_time:
      name: "Loop Time"
    cpu_frequency: 
      name: "CPU Frequency"
  - platform: wifi_signal
    name: wifi_signal
    id: wifistrength
    update_interval: 600s
  - platform: uptime
    name: WaterizerV2 Uptime Sensor
    id: uptimeinfo

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

binary_sensor:

  - platform: gpio
    pin: 
      number: GPIO14

      mode:

        input: true
        pullup: true
    name: float_switch
    id: float_switch
    filters:
      # This is the magic fix:
      # The sensor must report "Empty" (OFF) for at least 
      # 500 milliseconds (half a second) before ESPHome accepts it.
      # Short noise spikes will be ignored.
      - delayed_off: 500ms
    on_release:

      then:
        - switch.turn_off: pump1
        - switch.turn_off: pump2
        - switch.turn_off: pump3
        - switch.turn_off: pump4
        - switch.turn_off: pump5
        - switch.turn_on: led1  # Turn on LED1 to indicate pumps are disabled
    on_press:
      then:
        - switch.turn_off: led1  # Turn off LED1 to indicate pumps are enabled


  - platform: template
    id: any_pump_running
    # Returns true if Pump 1 OR Pump 2 OR ... is on
    lambda: |-
      return id(pump1).state || id(pump2).state || id(pump3).state || id(pump4).state || id(pump5).state; 
      // Add || id(pump3).state || id(pump4).state ...
      
    # When this logic becomes TRUE, turn on LED
    on_press:
      - switch.turn_on: led2
    # When this logic becomes FALSE (all pumps off), turn off LED
    on_release:
      - switch.turn_off: led2


script:
  - id: water_zone_1
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: float_switch
              - switch.is_on: zone1_enabled
          then:
            - logger.log: "Zone 1 Needs Water! Pumping..."
            - switch.turn_on: pump1
            - delay: 30s
            - switch.turn_off: pump1
          else:
            - logger.log: "Watering skipped: Tank empty or Zone 1 disabled."

  - id: water_zone_2
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: float_switch
              - switch.is_on: zone2_enabled
          then:
            - logger.log: "Zone 2 Needs Water! Pumping..."
            - switch.turn_on: pump2
            - delay: 5s 
            - switch.turn_off: pump2
          else:
            - logger.log: "Watering skipped: Tank empty or Zone 2 disabled."

  - id: water_zone_3
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: float_switch
              - switch.is_on: zone3_enabled
          then:
            - logger.log: "Zone 3 Needs Water! Pumping..."
            - switch.turn_on: pump3
            - delay: 5s 
            - switch.turn_off: pump3
          else:
            - logger.log: "Watering skipped: Tank empty or Zone 3 disabled."

  - id: water_zone_4
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: float_switch
              - switch.is_on: zone4_enabled
          then: 
            - logger.log: "Zone 4 Needs Water! Pumping..."
            - switch.turn_on: pump4
            - delay: 5s 
            - switch.turn_off: pump4
          else:
            - logger.log: "Watering skipped: Tank empty or Zone 4 disabled."

  - id: water_zone_5
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: float_switch
              - switch.is_on: zone5_enabled
          then: 
            - logger.log: "Zone 5 Needs Water! Pumping..."
            - switch.turn_on: pump5
            - delay: 5s 
            - switch.turn_off: pump5      
          else:
            - logger.log: "Watering skipped: Tank empty or Zone 5 disabled."

##
# Power up the moisture sensors, take a reading, powerdown
interval:
  - interval: 30min
    then:
      - switch.turn_on: Moisture
      - delay: 2s
      - component.update: Sensor1
      - component.update: Sensor2
      - component.update: Sensor3
      - component.update: Sensor4
      - component.update: Sensor5
      - delay: 2s
      - switch.turn_off: Moisture
